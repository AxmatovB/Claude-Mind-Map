services:
  claude-brain:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: claude-brain:local
    container_name: claude-brain
    ports:
      # Bound to loopback only — this app has no authentication and exposes
      # destructive endpoints (delete/wipe session data), so it must not be
      # reachable from other machines on the network. Without the
      # 127.0.0.1 prefix, Docker publishes the port on 0.0.0.0 (every
      # interface) by default, which would let anyone on the same LAN hit it.
      - "127.0.0.1:4545:4545"
    environment:
      PORT: 4545
      CLAUDE_DIR: /data/claude
      CODEX_DIR: /data/codex
      GEMINI_DIR: /data/gemini
      ANTIGRAVITY_DIR: /data/antigravity
    volumes:
      # Mounted narrowly — only the subpaths the parsers actually read, not
      # the whole home-config directory. The full ~/.claude, ~/.codex and
      # ~/.gemini dirs contain credentials the app has no business touching
      # (e.g. ~/.claude/.credentials.json, ~/.gemini/oauth_creds.json,
      # ~/.codex/.sandbox-secrets/); mounting the whole tree — even
      # read-only — would still hand every process in the container access
      # to those files.
      #
      # Each ${VAR:-./.empty} falls back to the repo's own empty placeholder
      # directory when that .env variable isn't set — run ./setup.sh (or
      # setup.ps1 on Windows) to generate .env automatically for whichever
      # agents you actually have installed. This means the container always
      # starts cleanly, on anyone's machine, whether they have one agent or
      # all three: a missing agent just mounts an empty read-only folder
      # (0 sessions for it) instead of failing the whole build.
      - ${CLAUDE_HOME_DIR:-./.empty}/projects:/data/claude/projects:ro
      - ${CODEX_HOME_DIR:-./.empty}/sessions:/data/codex/sessions:ro
      - ${GEMINI_HOME_DIR:-./.empty}/tmp:/data/gemini/tmp:ro
      - ${GEMINI_HOME_DIR:-./.empty}/projects.json:/data/gemini/projects.json:ro
      # Antigravity (antigravity-cli) is a separate product from Gemini CLI
      # with its own storage format, even though it also lives under
      # ~/.gemini on disk — see backend/parsers/antigravity.js.
      - ${ANTIGRAVITY_HOME_DIR:-./.empty}/brain:/data/antigravity/brain:ro
      - ${ANTIGRAVITY_HOME_DIR:-./.empty}/annotations:/data/antigravity/annotations:ro
    restart: unless-stopped
